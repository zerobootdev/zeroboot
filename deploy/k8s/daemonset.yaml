apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeroboot
  namespace: zeroboot
  labels:
    app: zeroboot
spec:
  selector:
    matchLabels:
      app: zeroboot
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: zeroboot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/v1/metrics"
    spec:
      # ── Scheduling: only run on KVM-capable nodes ───────────────────────────
      # Label KVM-capable nodes with:
      #   kubectl label node <node> kvm-capable=true
      # Or if using Karpenter, set this label in your NodePool spec.
      nodeSelector:
        kvm-capable: "true"

      # Graceful shutdown: allow in-flight requests to complete before pod stops
      terminationGracePeriodSeconds: 30

      containers:
        - name: zeroboot
          image: ghcr.io/zerobootdev/zeroboot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          # ── KVM device access ──────────────────────────────────────────────
          # Use privileged mode + hostPath mount (compatible with EKS without kubevirt).
          # If KubeVirt device plugin is installed, you can replace this with:
          #   resources.limits: { devices.kubevirt.io/kvm: "1" }
          # and remove securityContext.privileged.
          securityContext:
            privileged: true

          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"

          env:
            - name: ZEROBOOT_WORKDIR
              value: /var/lib/zeroboot
            - name: ZEROBOOT_PORT
              value: "8080"
            - name: ZEROBOOT_TEMPLATE_WAIT
              value: "15"
            # Optional: path to api_keys.json
            # - name: ZEROBOOT_API_KEYS_FILE
            #   value: /var/lib/zeroboot/api_keys.json

          volumeMounts:
            - name: data
              mountPath: /var/lib/zeroboot
            - name: kvm
              mountPath: /dev/kvm

          # ── Health checks ──────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 120  # template creation takes ~19s; allow 2x margin
            periodSeconds: 10
            failureThreshold: 6

      volumes:
        # ── Data volume (hostPath) ─────────────────────────────────────────────
        # zeroboot's Firecracker snapshots are bound to the host CPU microarchitecture
        # and KVM state, so local storage is the correct choice. Snapshots are
        # rebuilt automatically on first boot (~19s); cross-node migration is not
        # supported and not needed for short-lived sandbox workloads.
        # DirectoryOrCreate ensures the path is created on the node if absent.
        - name: data
          hostPath:
            path: /var/lib/zeroboot
            type: DirectoryOrCreate
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
